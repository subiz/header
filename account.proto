syntax = "proto2";

package account;

option go_package = "github.com/subiz/header/account";

import "common.proto";

message DashboardAgent {
	// optional int64 bot_build_showed = 12;
	repeated string pinned_user_views = 13; // list of agents that pinned this view
	repeated string user_view_display_fields = 14;
	repeated string user_view_order_by = 15; // +attr:fullname, -attr:email
	repeated string order_display_fields = 16;
	repeated string order_display_order_by = 17;
	optional string default_pos = 18;
	optional string default_shipping_provider = 19;
	optional string order_filter = 20; // json
	optional int64 conversation_seen = 21;
	// optional string price_function = 22;
	repeated string user_info_fields = 23;

	optional string last_call_device = 25;
	optional string last_call_number = 26; // main number
	optional string outbound_numbers_picker = 46; // ''=last samenet random

	optional int64 mute_call_until = 27; // ms
	optional int64 webphone_disabled = 28;
	optional int64 appphone_disabled = 29;

	// optional int64 call_promote_shown = 30;
	optional string on_call = 31;
	optional int64 last_close_task_notification = 32;
	optional int64 order_seen = 33;

	map<string,string> segment_order_by = 34;
	map<string,string> user_view_display_field = 35;

	optional int64 debug_log_collected = 36;
	optional int64 web_notification_volume = 37; // 0 default, 100 loudest
	optional int64 web_new_conversation_repeat_count = 39;
	optional string web_notificaiton_sound = 40; // alert (default), ding-2,  ding-3, doorbell

	map<string, string> segment_user_views_order = 38; // {sg_all: "unassigned,assigned"}

	optional int64 live_keeping_after_offline_seconds = 42; // auto <30 -> 30s
	optional int64 live_auto_refresh_seconds = 43; // auto <30 -> 30s
	repeated string live_metrics = 44; // host, path, ip
	optional string default_ticket_view_id = 45;
	optional string default_ticket_view_sort_by = 47;
	optional string default_email_signature_id = 48;

	optional string default_zalo_personal_account = 50;

	repeated ConvoFilter convo_filters = 52; //
	repeated string pinned_convo_filters = 53;
}

message ConvoFilters {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	repeated ConvoFilter filters = 3;
}

message ConvoFilter {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string key = 3; // for realtime use
	optional string order_by = 4; // -created, +created, +actived, -actived, +unreplied_at
	repeated ConvoFilterCondition conditions = 5;
	optional string anchor = 6;
	optional int64 limit = 7;
	optional string agent_id = 8;
	optional string name = 9;
	optional string id = 10;
	optional int64 total = 11;
	optional int64 num_unreads = 12;
}

message ConvoFilterCondition {
	optional string key = 3; // tags, touchpoint, state, is_unreplied, is_unread, created, is_muted, is_spam, from_ads, fb_post_ids
	optional string op = 4; // contain_one (default), contain_all, not_contain_all
	repeated string tags = 5;
	optional string touchpoint_channel = 6;
	repeated string touchpoint_sources = 7;
	optional string state = 8; // active, ended
	optional bool is_unreplied = 10;
	optional bool is_unread = 11;
	optional int64 created_from_ms = 12; //
	optional int64 created_to_ms = 13; //
	optional bool is_muted = 14;
	optional bool is_spam = 15;
	optional bool from_ads = 16;
	repeated string fb_post_ids = 17;
	optional bool is_dismissed = 18;
	optional bool is_missed = 19;
	optional string direction = 20; // inbound, outbound
}

message Agent {
	optional common.Context ctx = 1;
	optional string id = 2;
	optional string account_id = 3; // subiz only

	optional string fullname = 4;
	optional string email = 5; // reflect from agent profile
	optional string phone = 8; // reflect form agent profile
	optional int64 phone_confirmed = 10;
	optional string job_title = 11; // deprecated

	enum Gender {
		unset = 0;
		male = 1;
		female = 2;
	}
	optional string gender = 12; // reflect from agent profile
	optional string avatar_url = 13;
	optional string avatar_url_128 = 18;

	optional string lang = 14; // reflect from agent profile
	optional string timezone = 16; // reflect from agent profile
	optional int64 joined = 20;
	optional string invited_by = 21;

	enum AgentState {
		pending = 0; // waiting for invitation response
		active = 1;
		inactive = 2;
		deleted = 3;
	}

	optional string state = 22;
	optional int64 password_changed = 23; // reflect from agent profile
	optional int64 modified = 25;

	optional Account account = 28;
	optional string type = 33; // bot or agent (default is agent)
	optional string client_id = 34; // ID of bot

	optional Presence last_seen = 38;

	optional DashboardAgent dashboard_setting = 40;
	repeated string scopes = 41; // owner, supervisor
	// optional string internal_name = 42;
	optional int64 extension = 43; // 2343 3442
}

message Account {
	optional common.Context ctx = 1;
	optional string id = 2;
	optional string name = 3;
	optional string logo_url = 5;
	optional string logo_url_128 = 4; // png 128x128

	optional string owner_id = 6;
	optional string state = 7;
	optional int64 created = 8;
	optional int64 modified = 10;

	enum State {
		activated = 1;  // normal account
		deleted = 3; // haven't refreshed token in the last 90 days
		inactive = 4; // haven't refreshed token in the last 60 days
	}

	optional string city = 14;
	optional int32 zip_code = 16;
	// optional string tax_id = 17;
	optional string facebook = 18;
	optional string twitter = 22;
	optional string phone = 19;
	optional string address = 20;
	optional string url = 21;
	optional string lang = 23;
	optional string timezone = 26;
	optional string country = 27;

	optional string date_format = 29;
	optional BusinessHours business_hours = 30;
	optional string referrer_from = 31;

	optional LeadSetting lead_setting = 33;
	repeated string web_domains = 34;

	optional string locale = 39; // primary locale
	repeated string supported_locales = 40; // default vi-VN and en-US
	optional string currency = 41; // VND or USD cannot change
	optional bool currency_locked = 42;

	optional int64 login_locked = 43;
	optional string locked_code = 44; // policy, payment
	optional string deleted_by_agent = 47;
	optional InvoiceInfo invoice_info = 48;

	optional string plan = 49; // readonly
	optional int64 num_unreads = 50;
	optional string agent_state = 51;

	optional string primary_payment_method = 52; // bank_transfer
	optional int64 ai_requested = 53;
}

message InvoiceInfo {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string company_name = 4;
	optional string tax_code = 5;
	optional string fullname = 6;
	optional string phone = 7;
	optional string email = 8;
	optional string address = 9;

	optional int64 disabled_invoice_email = 10;
	optional int64 updated = 20;
	optional string updated_by = 21;
	optional int64 disabled = 22;
}

message LeadSetting {
	optional string assign_conversation_as_lead = 3; // all_assigned, assigned [default], joined, none (do no thing)
	optional int64 auto_update_phone = 4;
	optional int64 auto_update_email = 5;

	repeated string pinned_lead_fields = 6;
}

message InvoiceEmail {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional int64 created = 6; // sec
	repeated string invoice_ids = 8;
	repeated string invoice_urls = 9;
	repeated int32 overdue_days = 10;
}

message TrialEndingEmail {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional int64 created = 6; // sec
	optional int64 ended = 7;
}

message BusinessHours {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string id = 3;

	message WorkingDay {
		optional string weekday = 1;
		optional string start_time = 2;
		optional string end_time = 3;
	}
	repeated WorkingDay working_days = 4;

	message Holiday {
		optional int32 year = 1;
		optional int32 month = 2;
		optional int32 day = 3;
		optional string weekday = 4; // deprecated
		optional string name = 5;
		optional string start_time = 6;
		optional string end_time = 7;
	}
	repeated Holiday holidays = 5;
}

message SyncPublicHolidaysRequest {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string lang = 3;
	optional string country_code = 4;
}

message SearchSubRequest {
	optional common.Context ctx = 1;
	optional string query = 4;
	optional string anchor = 5;
	optional int32 limit = 6;
	optional string plan = 7;
	optional bool is_churned = 8;
	optional string state = 9;
	// optional uint32 billing_cycle_month = 8;
	optional string order_by = 10;
}

message Presences {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	repeated Presence presences = 4;
}

message Presence {
	optional common.Context ctx = 1;
	optional string account_id = 3;
	optional string user_id = 4;
	optional int64 pinged = 5;
	optional int64 pinged_minute = 6;

	optional string ip = 7;
	optional string ua = 8;

	optional bool is_focused = 9; // tell where the user is actually seeing the page

	optional string last_seen_convo_id = 10;
	optional string browser_tab_id = 11; // unique id for each tab
	optional string viewing_product_id = 12; // presence_update user with product linked
	optional string viewing_product_source_id = 13;  // presence_update user with product linked
	optional string viewing_product_sku = 14;  // presence_update user with product linked
	optional string viewing_product_title = 15;
}

message ReferrerPayoutBill {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	optional string id = 5;
	optional string created_by = 6;
	optional string created_by_type = 10;
	optional int64 created = 7;

	optional float amount = 12;
	optional int64 fpv_amount_usd = 13;
	optional int64 fpv_amount_vnd = 14;

	optional string description = 21;
	optional string picture_url = 22;
	optional string currency = 23;
	optional string original_bank_transfer_note = 18;
	optional string bank_transfer_note = 19;
}

message ReferrerPayoutBills {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	repeated ReferrerPayoutBill referrer_payout_bills = 4;
}

message ReferredCustomer {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	optional string for_account_id = 4;
	optional string owner_email = 5;
	optional string name = 6;
	optional string logo = 7;
	optional int64 registered = 8;
	optional string state = 9;
	optional int64 last_bill = 11;
	// optional int64 fpv_commission = 12;
	optional int64 fpv_total_earning_vnd = 14;
	optional int64 fpv_total_earning_usd = 15;
}

message ReferredCustomers {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	repeated ReferredCustomer referred_customers = 4;
}

message ReferredBill {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	optional string for_account_id = 4;
	optional string owner_email = 5;
	optional string account_name = 6;
	optional string account_logo = 7;
	optional int64 registered = 8;
	optional int64 fpv_commission = 12; // 100.000
	optional string bill_id = 13;

	optional int64 fpv_amount_vnd = 14;
	optional int64 fpv_amount_usd = 16;
	optional int64 created = 15;
	optional string currency = 17; // USD, VND
}

message ReferredBills {
	optional common.Context ctx = 1;
	optional string ref_id = 3;
	repeated ReferredBill bills = 4;
}

// float(15.500) -> * 1000_000 -> float pointer value
// 0.01 $ -> 0.01 * 1000000 = 10000
message ReferrerAgent {
	optional common.Context ctx = 1;
	optional string ref_id = 3; // agid
	optional Agent agent = 4; // read-only
	optional int64 fpv_total_earning_vnd = 7; // read-only vnd
	optional int64 fpv_earning_this_month_vnd = 8; // read-only vnd
	optional int64 fpv_total_earning_usd = 20; // read-only vnd
	optional int64 fpv_earning_this_month_usd = 21; // read-only vnd
	optional int64 fpv_balance_vnd = 10; // read-only // vnd
	optional int64 fpv_balance_usd = 12; // read-only // vnd
	optional int64 modified = 25; // read-only
	optional int64 last_payout = 11; // read-only

	optional int64 paying_customers = 13; // read-only
	optional int64 total_customers = 14; // read-only

	optional string bank_name = 15;
	optional string bank_account_name = 16;
	optional string bank_account_number = 17;
	optional int64 bank_info_modified_at = 18;
	optional int64 fpv_commission = 19; // 100_000
}

message ReferrerAgents {
	optional common.Context ctx = 1;
	repeated ReferrerAgent referrer_agents = 4;
}

message Comments {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	repeated Comment comments = 3;
}

message Comment {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string id = 3;
	optional string topic_id = 4;
	optional string topic_type = 5;
	optional string author_account_id = 8;
	optional string author_id = 9;
	optional string author_email = 10;
	optional string content = 11;
	optional int64 created = 12;
}

message Subscription {
	optional common.Context ctx = 1;
	optional string account_id = 3;
	optional int64 created = 11;
	optional string promotion_code = 4; // last recurring promotion code

	optional int64 started = 5; // ms
	optional uint32 billing_cycle_month = 15; // only use when renew
	// optional uint32 next_billing_cycle_month = 16; // @deprecated

	optional string plan = 17; // trial, standard, standard_unlmited, advanced, custom, advanced_unlimited
	// optional string next_plan = 18; // @deprecated

	// optional float credit = 27; // @deprecated
	optional common.Limit limit = 42; // combined from plan.limit and purchased_limit
	optional common.Limit purchased = 43; //

	optional int64 ended = 45;
	optional int64 churned = 47;

	// optional int64 fpv_credit_vnd = 48; // @deprecated, translate from credit, do not store in db
	optional int64 fpv_custom_price = 49; // usd, custom price, only edited by subiz
	// optional int64 fpv_next_custom_price = 53; // @depreacated usd, custom price only edited by subiz

	optional int64 num_agents = 50; // @deprecated
	// optional int64 use_ticket = 51;
	// optional int64 next_num_agents = 52; // @deprecated
	// optional int64 unlimited_ai_spending = 54;
	optional int64 fpv_credit_usd = 55; // soft = total bill - total invoice
	optional int64 fpv_novat_balance_usd = 58; // soft = total invoice(type=novat) - total novat spend
	optional int64 fpv_marketing_balance_vnd = 59; // soft = total invoice(type=marketing) - total marketing spend

	// optional int64 fpv_marketing_credit_limit_vnd = 60; // 0 - 40 only set by subiz
	// optional int64 fpv_novat_credit_limit_usd = 61; // 0 - 40 only set by subiz

	optional string note = 56;
	optional int64 fpv_price_per_day_usd = 57; // read only after upgrade

	optional int64 auto_renew_disabled = 62;

	optional int64 fpv_novat_budget_usd = 65; // 15
	optional int64 novat_last_payment = 66; //
	optional int64 novat_last_declined = 67; //
	optional int64 fpv_marketing_budget_vnd = 68; //
	optional int64 marketing_last_payment = 69; //
	optional int64 marketing_last_declined = 70; //
}

message Bill {
	optional common.Context ctx = 1;
	optional string id = 3;
	optional string account_id = 4;
	// optional float amount = 5;
	repeated string invoice_ids = 6;
	optional int64 created = 7;
	// optional Contact customer_info = 8;
	optional string payment_method = 10; // auto
	// optional int32 year = 11;
	optional string description = 12;

	// optional string credit_id = 15;
	// optional string status = 16;
	optional string currency = 17; // VND, USD

	optional string original_bank_transfer_note = 18;
	optional string bank_transfer_note = 19;
	optional int64 fpv_amount_vnd = 20;

	optional string request_id = 21; // random id from client

	optional string bank_account_id = 22;
	optional string by_agent_id = 23;
	optional int64 fpv_amount_usd = 24;
}

message Bills {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	repeated Bill bills = 3;
}

message Invoices {
	optional common.Context ctx = 1;
	repeated Invoice invoices = 2;
	optional string account_id = 3;
	optional string anchor = 4;
}

message ListInvoiceRequest {
	optional common.Context ctx = 1;
	optional string account_id = 2;

	// optional string anchor = 4;

	optional string credit_id = 6;
	optional bool compute_draft = 7;
}

message Invoice {
	optional common.Context ctx = 1;
	optional string account_id = 2;
	optional string id = 3;
	// optional float amount_due = 4;
	optional string promotion_code = 5;
	// optional string description = 6;
	// optional BillingInfo billing_info = 8;
	optional int64 due_date = 9;

	enum State {
		draft = 0; // not ready

		// official, awaiting confirmation by party A or B, can still change, will move to open:
		// 1. automatically 7 days after created
		// 2. payment received
		// 3. agent change the state
		pending = 1;
		open = 2; // confirmed, stable, cannot change
		paid = 3; // payment fully received, closed
		void = 4; // cancelled/deleted
	}
	optional string state = 10;
	optional int64 created = 11;
	repeated InvoiceItem items = 12;
	optional float subtotal = 14;
	optional float tax_percent = 15;
	optional float tax = 16;
	optional float total = 17;
	optional int64 updated = 18;

	// optional int32 year = 19; // optional
	// repeated Note notes = 22;
	repeated string bills = 23;
	optional float payment_made = 24;
	optional Subscription current_sub = 25; // optional
	// optional Plan current_plan = 26; // optional

	// optional string credit_id = 27; // @deprecated
	optional string currency = 28; // VND

	optional int64 fpv_total_vnd = 29; // read only
	optional int64 fpv_payment_made_vnd = 30; // read only
	optional bool is_gen_qr = 31; // not save in db
	optional string created_by = 32; // system
	// optional int64 promotion_code_price_fpv = 33; // read-only system

	optional int64 fpv_discount_vnd = 34; // read only

	optional int64 fpv_subtotal_vnd = 35; // read only

	// optional int64 fpv_promotion_vnd = 36; // read only
	// optional int64 fpv_promocode_commission_vnd = 36; // hidden
	// optional int64 fpv_referrer_commission_vnd = 36; // hidden
	optional string referrer_agent_id = 37; // read only

	optional int64 fpv_subtotal_usd = 38;
	optional int64 fpv_tax_percent = 39;
	optional int64 fpv_tax_usd = 40;
	optional int64 fpv_total_usd = 41;
	optional int64 fpv_payment_made_usd = 42;
	optional int64 fpv_discount_usd = 43; // read only

	optional string payment_num = 45;
	optional bool auto_generated = 46;

	optional Subscription sub = 50;

	optional int64 fpv_refcom_vnd = 53; // read only
	optional InvoiceInfo invoice_info = 54;
}

message FanpagesInvoiceItem {
	// optional string plan = 3;
	// optional int32 day_left = 4;
	optional int64 pack_size = 8; // typical 500
	optional int64 started = 9;
	optional int64 ended = 10;
	optional bool full_cycle = 11;
}

message TiktoksInvoiceItem {
	// optional string plan = 3;
	// optional int32 day_left = 4;
	optional int64 pack_size = 8; // typical 500
	optional int64 started = 9;
	optional int64 ended = 10;
	optional bool full_cycle = 11;
}

message WhatsappsInvoiceItem {
	// optional string plan = 3;
	// optional int32 day_left = 4;
	optional int64 pack_size = 8; // typical 500
	optional int64 started = 9;
	optional int64 ended = 10;
	optional bool full_cycle = 11;
}

message ZaloPersonalsInvoiceItem {
	// optional int32 day_left = 4;
	optional int32 pack_size = 8; // typical 5
	optional int64 started = 9;
	optional int64 ended = 10;
	optional bool full_cycle = 11;
}

message AgentInvoiceItem {
	optional string plan = 3;
	optional int32 day_left = 4;
	optional int32 agent_count = 8;
	optional int64 started = 9;
	optional int64 ended = 10;
}

message RenewInvoiceItem {
	optional string plan = 3;
	optional uint32 billing_cycle_month = 4;
	optional uint32 agent_count = 5;
	optional int64 from_time = 6;
	optional int64 fpv_save_percentage = 7;
}

message ReservedInvoiceItem {
	optional string old_plan = 3;
	optional int64 old_agent_count = 4;
	optional int64 old_billing_cycle_month = 5;
	// optional bool old_is_unlimited_agent = 5;
	// optional int64 old_fpv_save_percentage = 6;
	optional int32 day_left = 7;
	optional int64 old_started = 8; // now (not sub.started)
	optional int64 old_ended = 9;
	optional int64 old_count = 10;
}

message PlanInvoiceItem {
	optional uint32 agent_count = 2;
	optional uint32 billing_cycle_month = 5;
	optional string old_plan = 6;
	optional string new_plan = 3;
	optional float save_percentage = 9; // remove
	optional int64 started = 8;
	optional int32 day_left = 4;
	optional uint32 old_agent_count = 10;
	optional bool is_unlimited_agent = 11;
	optional int64 fpv_save_percentage = 12;
	optional int64 ended = 13; // most trusted
}

message MarketingInvoiceItem {
	optional int64 expired = 4;
}

message NoVATInvoiceItem {
	optional int64 expired = 4;
}

message InvoiceItem {
	optional string headline = 4;
	optional string description = 5;
	// optional string invoice_id = 6; // remove
	optional int32 quantity = 7;
	optional float price = 8; // per unit

	message Data {
		optional RenewInvoiceItem renew = 2;
		optional AgentInvoiceItem agent = 3;
		optional PlanInvoiceItem plan = 5;
		optional MarketingInvoiceItem marketing = 6;
		optional ReservedInvoiceItem reserved_plan = 7;
		optional NoVATInvoiceItem novat = 8;
		optional FanpagesInvoiceItem fanpages = 9;
		optional ZaloPersonalsInvoiceItem zalo_personals = 10;
		optional ReservedInvoiceItem reserved_fanpages = 11;
		optional ReservedInvoiceItem reserved_zalo_personals = 12;
		optional TiktoksInvoiceItem tiktoks = 13;
		optional WhatsappsInvoiceItem whatsapps = 14;
	}
	optional string type = 18;
	optional Data data = 9;
	optional float total_price = 10;	// = (* quantity price)

	optional int64 fpv_price_vnd = 11;
	optional int64 fpv_total_price_vnd = 12;
	optional int64 fpv_discount_vnd = 13;

	optional int64 fpv_price_usd = 15;
	optional int64 fpv_total_price_usd = 16;
	optional int64 fpv_discount_usd = 17;
}

message Logs {
	optional common.Context ctx = 1;
	repeated Log logs = 5;
	optional string next_anchor = 6;
}

message Log {
	optional common.Context ctx = 1;
	enum Action {
		create_invoice = 0;
		change_invoice_status = 1;
		create_discount = 2;
		delete_discount = 3;
		redeem_discount = 4;
		add_credit = 5;
		redeem_credit = 6;
		delete_account = 7;
		change_plan = 8;
		renew_subscription = 10;
		click_subscribe_button = 11;
		pay_for_referrer = 12;
		add_money_for_referrer = 13;
		pay_invoice = 14;
		charge_stripe = 15;
		create_bill = 16;
		use_credit = 17;
		edit_subscription = 18;
		edit_invoice = 19;
		downgrade = 20;
	}
	optional string user = 2;
	optional string id = 8;
	optional string action = 3;
	optional int64 created = 4;
	optional string description = 5;
	optional string account_id = 6;
	optional string stack = 9;
	optional string ref_ctx = 10;
}

message String {
	optional common.Context ctx = 1;
	optional string str = 2;
}

message InvoiceCreatedEmail {
	optional common.Context ctx = 1;
	optional string account_id = 3;
	optional string invoice_id = 5;
	optional int64 created = 6;
	optional string invoice_created = 8;
	optional string invoice_link = 9;
	optional int64 invoice_duedate = 10; // ms
}

message UpdateSubscriptionRequest {
	optional common.Context ctx = 1;
	optional string account_id = 2;

	optional Subscription subscription = 4;
	optional string invoice_mode = 5; // none (only subiz can do this), open (create invoice), pending (just create draft invoice without update, update after paid)
	optional int64 now = 6; // for testing only
}
